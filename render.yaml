services:
  - type: web
    name: echochamber
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    region: singapore # 또는 frankfurt, oregon, ohio
    plan: free
    envVars:
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LLM_DAILY_UNIT_CAP
        value: "100"
      - key: LLM_REQUESTS_PER_HOUR
        value: "10"
      - key: DEMO_READ_ONLY
        value: "true"
      - key: DISABLE_DOCS
        value: "true"
      - key: CORS_ORIGINS
        value: ""
